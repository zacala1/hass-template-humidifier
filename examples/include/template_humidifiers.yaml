# /config/template_humidifiers.yaml: the list that `!include` puts under the
# `template_humidifier:` key. It starts with the sections themselves.

- humidifier:
    - name: "Living Room Humidifier"
      unique_id: living_room_humidifier
      device_class: humidifier

      state: "{{ is_state('switch.living_room_humidifier_power', 'on') }}"
      current_humidity: "{{ states('sensor.living_room_humidity') }}"
      target_humidity: "{{ states('number.living_room_humidifier_target') }}"

      turn_on:
        - action: switch.turn_on
          target:
            entity_id: switch.living_room_humidifier_power
      turn_off:
        - action: switch.turn_off
          target:
            entity_id: switch.living_room_humidifier_power
      set_humidity:
        - action: number.set_value
          target:
            entity_id: number.living_room_humidifier_target
          data:
            value: "{{ humidity }}"
