version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # These four are pinned to each other (the test plugin pins exact versions
      # of pytest, pytest-cov and, through Home Assistant's own requirements,
      # sqlalchemy), so Dependabot cannot bump them one at a time and every
      # attempt fails to resolve. They move together, by hand, when the supported
      # Home Assistant baseline changes.
      - dependency-name: "homeassistant"
      - dependency-name: "pytest-homeassistant-custom-component"
      - dependency-name: "pytest"
      - dependency-name: "pytest-cov"
