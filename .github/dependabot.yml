version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # These two are version-locked to each other and must move together.
      home-assistant:
        patterns:
          - "homeassistant"
          - "pytest-homeassistant-custom-component"
